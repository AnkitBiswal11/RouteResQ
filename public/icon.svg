<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142D4F" />
      <stop offset="100%" stop-color="#0B1A2F" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2878E8" />
      <stop offset="100%" stop-color="#13A878" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Navy Shield -->
  <path d="M 256,40 C 360,80 440,90 440,210 C 440,340 330,430 256,472 C 182,430 72,340 72,210 C 72,90 152,80 256,40 Z" 
        fill="url(#shieldGrad)" stroke="#2878E8" stroke-width="8" />

  <!-- Emergency Radar Waves (Subtle Signal Pulse) -->
  <path d="M 256,120 A 136,136 0 0 1 352,160" fill="none" stroke="#2878E8" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <path d="M 256,90 A 166,166 0 0 1 374,140" fill="none" stroke="#13A878" stroke-width="5" stroke-linecap="round" opacity="0.4" />

  <!-- Road / Highway Perspective -->
  <path d="M 190,380 L 235,210 L 277,210 L 322,380 Z" fill="url(#roadGrad)" opacity="0.9" />
  <!-- Road Dashes -->
  <line x1="256" y1="220" x2="256" y2="250" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="280" x2="256" y2="320" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  <line x1="256" y1="345" x2="256" y2="375" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />

  <!-- Medical Cross in Emergency Red with White Border -->
  <g transform="translate(256, 175)">
    <rect x="-38" y="-12" width="76" height="24" rx="4" fill="#F00016" stroke="#FFFFFF" stroke-width="4" filter="url(#glow)" />
    <rect x="-12" y="-38" width="24" height="76" rx="4" fill="#F00016" stroke="#FFFFFF" stroke-width="4" filter="url(#glow)" />
  </g>
</svg>
